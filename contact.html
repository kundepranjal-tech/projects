
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - My Portfolio</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">My Portfolio</h2>

            <button class="menu-toggle" aria-label="Toggle menu">
                ☰
            </button>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a class="active" href="contact.html">Contact</a>

                <button id="themeToggle" type="button">🌙</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Contact Me</h1>

        <section class="card contact-card">
            <h2>Get In Touch</h2>

            <p>
                If you have any questions or project ideas,
                feel free to contact me.
            </p>

            <p><strong>Name:</strong> Pranjal Kunde</p>
            <p><strong>Email:</strong> your.email@example.com</p>
            <p><strong>Location:</strong> Nashik, Maharashtra</p>

            <h2>Send a Message</h2>

            <form id="contactForm">

                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                    minlength="2"
                >

                <label for="email">Your Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here..."
                    required
                    minlength="10"
                ></textarea>

                <button class="btn" type="submit">
                    Submit Message
                </button>

                <p id="formMessage" role="status" aria-live="polite"></p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span class="year"></span> Pranjal Kunde</p>
    </footer>

</body>
</html>
